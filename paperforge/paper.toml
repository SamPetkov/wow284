# WOW-284 Paperforge instance.
# The canonical manuscript remains ../main.tex; generated PreTeXt source is never
# edited by hand. Paperforge is pinned by .github/workflows/paperforge-pages.yml.

[paperforge]
instance_schema = 1

[paper]
title = "Counterexamples, Spectral Obstructions, and Deletion Stability for WOW-284"
slug = "wow284"
document_id = "wow284"

[inputs]
ai_draft = "../main.tex"

# Per-statement Lean badges are deliberately deferred until the generated
# declaration map has been reviewed. The project site still links to the complete
# public Lean development and its exact scope.

[ingest]
mathbb_letters = "F"
numbering_profile = "amsart-shared-section-theorems-global-equations"
authors = ["@draft"]

[style]
corpus = "style-corpus/"
advice = "style-corpus/ADVICE.md"

[references]
pdf_dir = "references/"
bib = "source/references.ptx"
labels = "references/bib-labels.json"

[notation]
far_words = 1500
near_hover_delay_ms = 200
far_hover_delay_ms = 500
defsite_highlight_delay_ms = 120

[detail]
default_level = 1
max_level = 3

[plagiarism]
ngram = 7
error_run = 12
sources = []

[build]
web_output = "output/web"
print_output = "output/print"

[site]
dir = "web-assets/site"
pdf = "../main.pdf"
