name: Proof Audit 14 optimal-slack Gram hierarchy

on:
  push:
    paths:
      - "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md"
      - "research-notes/INTEGRAL_OPTIMAL_SLACK_COLLAPSE.md"
      - "research-notes/OPTIMAL_SLACK_EXCESS_MATRIX.md"
      - "research-notes/TWO_GRAM_HIERARCHIES.md"
      - "research-notes/FOUR_TO_ONE_EXCESS_BOUND.md"
      - "scripts/verify_optimal_slack_gram_unification.py"
      - "scripts/verify_integral_optimal_slack_collapse.py"
      - "scripts/verify_optimal_slack_excess_matrix.py"
      - "scripts/verify_two_gram_hierarchies.py"
      - "scripts/verify_four_to_one_excess_bound.py"
      - "scripts/clean_optimal_slack_note.py"
      - ".github/workflows/proof-audit-14-optimal-slack.yml"
  pull_request:
    paths:
      - "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md"
      - "research-notes/INTEGRAL_OPTIMAL_SLACK_COLLAPSE.md"
      - "research-notes/OPTIMAL_SLACK_EXCESS_MATRIX.md"
      - "research-notes/TWO_GRAM_HIERARCHIES.md"
      - "research-notes/FOUR_TO_ONE_EXCESS_BOUND.md"
      - "scripts/verify_optimal_slack_gram_unification.py"
      - "scripts/verify_integral_optimal_slack_collapse.py"
      - "scripts/verify_optimal_slack_excess_matrix.py"
      - "scripts/verify_two_gram_hierarchies.py"
      - "scripts/verify_four_to_one_excess_bound.py"
      - "scripts/clean_optimal_slack_note.py"
      - ".github/workflows/proof-audit-14-optimal-slack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Clean and persist the audited note
        run: |
          python scripts/clean_optimal_slack_note.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md
          if git diff --cached --quiet; then
            echo "No note cleanup required."
          else
            git commit -m "Repair Audit 14 source hygiene [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the optimal-slack Gram audit
        run: python scripts/verify_optimal_slack_gram_unification.py
      - name: Run the integral-collapse audit
        run: python scripts/verify_integral_optimal_slack_collapse.py
      - name: Run the excess-matrix audit
        run: python scripts/verify_optimal_slack_excess_matrix.py
      - name: Run the deletion Gram synthesis audit
        run: python scripts/verify_two_gram_hierarchies.py
      - name: Run the four-to-one excess audit
        run: python scripts/verify_four_to_one_excess_bound.py
      - name: Check source hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md",
              "research-notes/INTEGRAL_OPTIMAL_SLACK_COLLAPSE.md",
              "research-notes/OPTIMAL_SLACK_EXCESS_MATRIX.md",
              "research-notes/TWO_GRAM_HIERARCHIES.md",
              "research-notes/FOUR_TO_ONE_EXCESS_BOUND.md",
              "scripts/verify_optimal_slack_gram_unification.py",
              "scripts/verify_integral_optimal_slack_collapse.py",
              "scripts/verify_optimal_slack_excess_matrix.py",
              "scripts/verify_two_gram_hierarchies.py",
              "scripts/verify_four_to_one_excess_bound.py",
              "scripts/clean_optimal_slack_note.py",
          ):
              data = Path(name).read_bytes()
              assert not any(byte < 32 and byte not in {9, 10} for byte in data), name
          print("source hygiene: PASS")
          PY
