      - "scripts/verify_proof_audit_14c_order50_lifts.py"
      - "scripts/order50_lift_independent.cpp"
      - "scripts/order50_completion_filter.cpp"
      - "scripts/materialize_order50_lift_audit.py"
      - "scripts/.audit14c-bootstrap/payload.*"
      - "scripts/clean_optimal_slack_note.py"
      - ".github/workflows/proof-audit-14-optimal-slack.yml"
  workflow_dispatch:

concurrency:
  group: proof-audit-14-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Materialize and persist Proof Audit 14C sources
        run: |
          python scripts/materialize_order50_lift_audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research-notes/ORDER50_LIFT_EXCLUSION.md \
            research-notes/PROOF_AUDIT_14C_ORDER50_LIFTS.md \
            scripts/verify_order50_lift_exclusion.py \
            scripts/verify_proof_audit_14c_order50_lifts.py \
            scripts/order50_lift_independent.cpp \
            scripts/order50_completion_filter.cpp
          if git diff --cached --quiet; then
            echo "Proof Audit 14C sources already materialized."
          else
            git commit -m "Materialize Proof Audit 14C exact sources"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
      - name: Clean and persist the audited note
        run: |
          python scripts/clean_optimal_slack_note.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md
          if git diff --cached --quiet; then
            echo "No note cleanup required."
          else
            git commit -m "Repair Audit 14 source hygiene"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the optimal-slack Gram audit
        run: python scripts/verify_optimal_slack_gram_unification.py
      - name: Run the integral-collapse audit
        run: python scripts/verify_integral_optimal_slack_collapse.py
      - name: Run the excess-matrix audit
        run: python scripts/verify_optimal_slack_excess_matrix.py
      - name: Run the deletion Gram synthesis audit
        run: python scripts/verify_two_gram_hierarchies.py
      - name: Run the three-to-one excess audit
        run: python scripts/verify_three_to_one_excess_bound.py
      - name: Run the equality-rigidity audit
        run: python scripts/verify_three_to_one_equality_rigidity.py
      - name: Run independent Proof Audit 14A
        run: python scripts/verify_proof_audit_14_three_to_one.py
      - name: Run the signed-complement bridge audit
        run: python scripts/verify_signed_complement_bridge.py
      - name: Run the signed-primary transfer audit
        run: python scripts/verify_signed_primary_transfer.py
      - name: Run the order-50 minus-two multiplicity audit
        run: python scripts/verify_order50_minus_two_multiplicity.py
      - name: Run the corrected unsigned-complement audit
        run: python scripts/verify_order50_unsigned_complement_exclusion.py
      - name: Run the signed-complement disconnectedness audit
        run: python scripts/verify_order50_signed_complement_disconnected.py
      - name: Run the canonical component-quotient audit
        run: python scripts/verify_order50_component_quotients.py
      - name: Run independent Proof Audit 14B
        run: python scripts/verify_proof_audit_14b_component_quotients.py
      - name: Run Proof Audit 14C Type A
        run: python scripts/verify_order50_lift_exclusion.py --type-a
      - name: Run Proof Audit 14C Type B
        run: python scripts/verify_order50_lift_exclusion.py --type-b
      - name: Run independent Proof Audit 14C
        run: python scripts/verify_proof_audit_14c_order50_lifts.py
      - name: Compile exact sources
        run: |
          python -m py_compile \
            scripts/verify_order50_lift_exclusion.py \
            scripts/verify_proof_audit_14c_order50_lifts.py
          g++ -O3 -std=c++17 scripts/order50_lift_independent.cpp -o /tmp/order50_lift_independent
          g++ -O3 -std=c++17 scripts/order50_completion_filter.cpp -o /tmp/order50_completion_filter
      - name: Check source hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          names = (
              "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md",
              "research-notes/INTEGRAL_OPTIMAL_SLACK_COLLAPSE.md",
              "research-notes/OPTIMAL_SLACK_EXCESS_MATRIX.md",
              "research-notes/TWO_GRAM_HIERARCHIES.md",
              "research-notes/THREE_TO_ONE_EXCESS_BOUND.md",
              "research-notes/THREE_TO_ONE_EQUALITY_RIGIDITY.md",
              "research-notes/PROOF_AUDIT_14_THREE_TO_ONE.md",
              "research-notes/SIGNED_COMPLEMENT_BRIDGE.md",
              "research-notes/SIGNED_PRIMARY_TRANSFER.md",
              "research-notes/ORDER50_MINUS_TWO_MULTIPLICITY.md",
              "research-notes/ORDER50_UNSIGNED_COMPLEMENT_EXCLUSION.md",
              "research-notes/ORDER50_SIGNED_COMPLEMENT_DISCONNECTED.md",
              "research-notes/ORDER50_COMPONENT_QUOTIENT_CLASSIFICATION.md",
              "research-notes/PROOF_AUDIT_14B_COMPONENT_QUOTIENTS.md",
              "research-notes/ORDER50_LIFT_EXCLUSION.md",
              "research-notes/PROOF_AUDIT_14C_ORDER50_LIFTS.md",
              "research-notes/LITERATURE_AUDIT_14.md",
              "scripts/verify_optimal_slack_gram_unification.py",
              "scripts/verify_integral_optimal_slack_collapse.py",
              "scripts/verify_optimal_slack_excess_matrix.py",
              "scripts/verify_two_gram_hierarchies.py",
              "scripts/verify_three_to_one_excess_bound.py",
              "scripts/verify_three_to_one_equality_rigidity.py",
              "scripts/verify_proof_audit_14_three_to_one.py",
              "scripts/verify_signed_complement_bridge.py",
              "scripts/verify_signed_primary_transfer.py",
              "scripts/verify_order50_minus_two_multiplicity.py",
              "scripts/verify_order50_unsigned_complement_exclusion.py",
              "scripts/verify_order50_signed_complement_disconnected.py",
              "scripts/verify_order50_component_quotients.py",
              "scripts/verify_proof_audit_14b_component_quotients.py",
              "scripts/order50_component_quotients_c7.cpp",
              "scripts/order50_component_quotients_c10.cpp",
              "scripts/verify_order50_lift_exclusion.py",
              "scripts/verify_proof_audit_14c_order50_lifts.py",
              "scripts/order50_lift_independent.cpp",
              "scripts/order50_completion_filter.cpp",
              "scripts/materialize_order50_lift_audit.py",
              "scripts/clean_optimal_slack_note.py",
          )
          for name in names:
              data = Path(name).read_bytes()
              assert not any(byte < 32 and byte not in {9, 10} for byte in data), name
          chunks = sorted(Path("scripts/.audit14c-bootstrap").glob("payload.*"))
          assert len(chunks) == 7, chunks
          for path in chunks:
              data = path.read_bytes()
              assert not any(byte < 32 and byte not in {9, 10} for byte in data), path
          print("source hygiene: PASS")
          PY
