name: Proof Audit 14 optimal-slack Gram hierarchy

on:
  push:
    paths:
      - "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md"
      - "scripts/verify_optimal_slack_gram_unification.py"
      - ".github/workflows/proof-audit-14-optimal-slack.yml"
  pull_request:
    paths:
      - "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md"
      - "scripts/verify_optimal_slack_gram_unification.py"
      - ".github/workflows/proof-audit-14-optimal-slack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the independent exact audit
        run: python scripts/verify_optimal_slack_gram_unification.py
      - name: Check source hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "research-notes/OPTIMAL_SLACK_GRAM_UNIFICATION.md",
              "scripts/verify_optimal_slack_gram_unification.py",
          ):
              data = Path(name).read_bytes()
              assert not any(byte < 32 and byte not in {9, 10} for byte in data), name
          print("source hygiene: PASS")
          PY
