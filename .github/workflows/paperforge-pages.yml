name: Paperforge interactive paper

on:
  pull_request:
    paths:
      - "main.tex"
      - "main.pdf"
      - "main.bbl"
      - "references.bib"
      - "CITATION.cff"
      - "BUILD_VERIFICATION.txt"
      - "SHA256SUMS"
      - "paperforge/**"
      - ".github/workflows/paperforge-pages.yml"
  push:
    branches: [main]
    paths:
      - "main.tex"
      - "main.pdf"
      - "main.bbl"
      - "references.bib"
      - "CITATION.cff"
      - "BUILD_VERIFICATION.txt"
      - "SHA256SUMS"
      - "paperforge/**"
      - ".github/workflows/paperforge-pages.yml"
  workflow_dispatch:

concurrency:
  group: paperforge-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAPERFORGE_COMMIT: 726cc7d679441e28f39cfd52d3e2dd0251c79a6d
  PRETEXT_VERSION: 2.43.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out WOW-284
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils xsltproc

      - name: Install pinned Paperforge and PreTeXt
        env:
          PAPERFORGE_TOOL_ROOT: ${{ runner.temp }}/paperforge-tool
        run: |
          git clone https://github.com/roed-math/paperforge.git "$PAPERFORGE_TOOL_ROOT"
          git -C "$PAPERFORGE_TOOL_ROOT" checkout --detach "$PAPERFORGE_COMMIT"
          python -m pip install --upgrade pip
          python -m pip install "pretext==$PRETEXT_VERSION" pybtex
          python -m pip install -e "$PAPERFORGE_TOOL_ROOT" -e "$PAPERFORGE_TOOL_ROOT/validators"

      - name: Complete the Paperforge instance scaffold
        env:
          PAPERFORGE_TOOL_ROOT: ${{ runner.temp }}/paperforge-tool
        run: |
          paperforge init paperforge \
            --force \
            --title "Counterexamples, Spectral Obstructions, and Deletion Stability for WOW-284" \
            --slug wow284 \
            --draft inputs/draft/main.tex \
            --no-lean \
            --site \
            --non-interactive
          python paperforge/scripts/hydrate_paperforge_assets.py "$PAPERFORGE_TOOL_ROOT"
          python paperforge/scripts/prepare_paperforge_inputs.py
          paperforge doctor paperforge

      - name: Convert the canonical LaTeX manuscript
        run: paperforge ingest paperforge --bootstrap

      - name: Build the interactive paper
        run: paperforge build web paperforge

      - name: Assemble and validate the project site
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: paperforge build site paperforge

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: wow284-paperforge-site
          path: paperforge/output/site
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: paperforge/output/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
