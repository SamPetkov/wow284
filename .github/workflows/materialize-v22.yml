name: Verify expanded manuscript mirror

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the synchronized v22 mirror
        run: python scripts/materialize_v22_bootstrap.py
