name: Proof Audit 13 verification

on:
  pull_request:
    paths:
      - "research-notes/PROOF_AUDIT_13_HS_ROBUSTNESS_RADIUS.md"
      - "scripts/verify_proof_audit_13_hs_robustness.py"
      - ".github/workflows/proof-audit-13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof-audit-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile exact verifier
        run: python -m py_compile scripts/verify_proof_audit_13_hs_robustness.py
      - name: Reject floating-point proof operations
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('scripts/verify_proof_audit_13_hs_robustness.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          banned = []
          def qname(value):
              if isinstance(value, ast.Name):
                  return value.id
              if isinstance(value, ast.Attribute):
                  prefix = qname(value.value)
                  return f'{prefix}.{value.attr}' if prefix else value.attr
              return ''
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  if any(a.name == 'numpy' or a.name.startswith('numpy.') for a in node.names):
                      banned.append((node.lineno, 'numpy import'))
              elif isinstance(node, ast.ImportFrom):
                  module = node.module or ''
                  if module == 'numpy' or module.startswith('numpy.'):
                      banned.append((node.lineno, 'numpy import'))
              elif isinstance(node, ast.Call):
                  name = qname(node.func)
                  if name in {'float', 'complex'} or name.endswith('.evalf') or '.linalg.' in name:
                      banned.append((node.lineno, name))
          if banned:
              raise SystemExit(f'banned floating proof operations: {banned}')
          print('Audit 13 no-floating check: PASS')
          PY
      - name: Run Proof Audit 13
        run: python scripts/verify_proof_audit_13_hs_robustness.py
