name: Proof Audit 10 verification

on:
  pull_request:
    paths:
      - "research-notes/PROOF_AUDIT_10_ENDPOINT_DIAMETER.md"
      - "scripts/verify_proof_audit_10_endpoint_diameter.py"
      - "scripts/audit_no_float_proof_paths.py"
      - ".github/workflows/proof-audit-10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof-audit-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile exact verifier
        run: |
          python -m py_compile scripts/verify_proof_audit_10_endpoint_diameter.py
          python -m py_compile scripts/audit_no_float_proof_paths.py
      - name: Enforce no-floating proof paths
        run: python scripts/audit_no_float_proof_paths.py
      - name: Run Proof Audit 10
        run: python scripts/verify_proof_audit_10_endpoint_diameter.py
