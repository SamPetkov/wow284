name: Final arXiv audit export

on:
  pull_request:
    paths:
      - "main.tex"
      - "references.bib"
      - "main.bbl"
      - "main.pdf"
      - "arxiv/**"
      - "CITATION.cff"
      - "BUILD_VERIFICATION.txt"
      - "scripts/apply_final_arxiv_line_review.py"
      - "scripts/run_final_arxiv_line_review.py"
      - "scripts/apply_final_arxiv_line_review_last.py"
      - "scripts/align_final_arxiv_validators.py"
      - ".github/workflows/final-arxiv-audit-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply final line-review corrections
        run: |
          set -o pipefail
          {
            python scripts/run_final_arxiv_line_review.py
            python scripts/apply_final_arxiv_line_review_last.py
            python scripts/align_final_arxiv_validators.py
          } 2>&1 | tee final-line-review-apply.log
      - name: Install exact, TeX, and document dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra poppler-utils pandoc
      - name: Synchronize and validate release
        run: |
          set -o pipefail
          {
            python scripts/sync_manuscript_artifacts.py
            python scripts/audit_v22_manuscript.py
            python scripts/sync_manuscript_artifacts.py --check
            python scripts/validate_repository.py
          } 2>&1 | tee final-line-review-sync.log
      - name: Commit synchronized v2.2.2 artifacts to the audit branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
          else
            git commit -m "Finalize WOW-284 v2.2.2 after line-by-line audit"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Compile canonical manuscript from source
        run: |
          build_dir="$(mktemp -d)"
          cp main.tex references.bib "$build_dir"/
          cd "$build_dir"
          latexmk -pdf -bibtex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          ! grep -E "undefined citations|undefined references|There were undefined|Overfull \\hbox|Underfull \\hbox|Missing character" main.log
          cp main.pdf "$GITHUB_WORKSPACE/final-audit-main.pdf"
          cp main.log "$GITHUB_WORKSPACE/final-audit-main.log"
          pdftotext -layout main.pdf "$GITHUB_WORKSPACE/final-audit-text.txt"
      - name: Verify arXiv source archive in isolation
        run: |
          arxiv_dir="$(mktemp -d)"
          unzip -q arxiv/wow284_arxiv_source.zip -d "$arxiv_dir"
          cmp main.tex "$arxiv_dir/main.tex"
          cmp references.bib "$arxiv_dir/references.bib"
          cmp main.bbl "$arxiv_dir/main.bbl"
          cd "$arxiv_dir"
          latexmk -pdf -bibtex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          ! grep -E "undefined citations|undefined references|There were undefined|Overfull \\hbox|Underfull \\hbox|Missing character" main.log
          cp main.pdf "$GITHUB_WORKSPACE/final-audit-arxiv.pdf"
          pdftotext -layout main.pdf "$GITHUB_WORKSPACE/final-audit-arxiv-text.txt"
          cmp "$GITHUB_WORKSPACE/final-audit-text.txt" "$GITHUB_WORKSPACE/final-audit-arxiv-text.txt"
      - name: Record PDF preflight data
        run: |
          pdfinfo final-audit-main.pdf > final-audit-pdfinfo.txt
          pdffonts final-audit-main.pdf > final-audit-pdffonts.txt
          grep -F "Title:           Counterexamples, Spectral Obstructions, and Deletion Stability for WOW-284" final-audit-pdfinfo.txt
          grep -F "samuil.petkov@phys.ens.psl.eu" final-audit-text.txt
          test "$(pdffonts final-audit-main.pdf | awk 'NR>2 && $4 != "yes" {count++} END {print count+0}')" = "0"
      - name: Capture final repository snapshot
        run: |
          tar --exclude=.git --exclude=wow284-final-audit-snapshot.tar.gz \
            -czf wow284-final-audit-snapshot.tar.gz . || test $? = 1
      - name: Upload exact submission audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wow284-final-arxiv-audit-bundle
          path: |
            main.tex
            references.bib
            main.bbl
            main.pdf
            final-line-review-apply.log
            final-line-review-sync.log
            final-audit-main.pdf
            final-audit-arxiv.pdf
            final-audit-main.log
            final-audit-pdfinfo.txt
            final-audit-pdffonts.txt
            final-audit-text.txt
            final-audit-arxiv-text.txt
            arxiv/wow284_arxiv_source.zip
            CITATION.cff
            BUILD_VERIFICATION.txt
            wow284-final-audit-snapshot.tar.gz
          if-no-files-found: warn
